<ion-content class="login-bg">
  <div class="login-container">
    
    <h2>Bienvenido</h2>
    <p>Inicia sesión para continuar</p>
    <form (ngSubmit)="onSubmit()">
        <ion-item class="login-item">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-input type="email" placeholder="Correo Electrónico" required [(ngModel)]="email" name="email"></ion-input>
        </ion-item>
        <ion-item class="login-item">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input type="password" placeholder="Contraseña" required [(ngModel)]="password" name="password"></ion-input>
        </ion-item>
        <ion-button expand="block" class="login-btn" type="submit">Iniciar Sesión</ion-button>
    </form>
    <div class="login-footer">
      <ion-text color="medium">¿No tienes cuenta?</ion-text>
      <ion-button fill="clear" size="small" id="open-register-modal">Regístrate</ion-button>
    </div>
  </div>

  <ion-modal trigger="open-register-modal" #modal>
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Registro</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="modal.dismiss()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <div class="login-container">
          <p>Crea una cuenta nueva</p>
          <form (ngSubmit)="onRegister()">
            <ion-item class="login-item">
              <ion-icon name="mail-outline" slot="start"></ion-icon>
              <ion-input type="email" placeholder="Correo Electrónico" required [(ngModel)]="registerEmail" name="registerEmail"></ion-input>
            </ion-item>
            <ion-item class="login-item">
              <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
              <ion-input type="password" placeholder="Contraseña" required [(ngModel)]="registerPassword" name="registerPassword"></ion-input>
            </ion-item>
            <ion-button expand="block" class="login-btn" type="submit">Registrar</ion-button>
          </form>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
