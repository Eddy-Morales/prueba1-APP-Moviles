<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Animes
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Top Animes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label position="floating">Buscar anime</ion-label>
    <ion-input [(ngModel)]="searchText" placeholder="Escribe el nombre del anime"></ion-input>
  </ion-item>

  <ion-button id="open-modal-tab2">Informacion</ion-button>

<ion-modal trigger="open-modal-tab2" #modal>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Animes</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="modal.dismiss()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <div style="text-align: center;">
        <h3>¡Hola friki!</h3>
        <p>En esta seccion puedes encontrar información sobre tus animes favoritos.</p>
        <ion-icon name="happy-outline" style="font-size: 64px;"></ion-icon>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let anime of filteredAnimes()">
        <ion-card>
          <img [src]="anime.images.jpg.large_image_url" [alt]="anime.title" />
          <ion-card-header>
            <ion-card-subtitle>{{ anime.type }}</ion-card-subtitle>
            <ion-card-title>{{ anime.title }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p><strong>Score:</strong> {{ anime.score }}</p>
            <p><strong>Episodes:</strong> {{ anime.episodes }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>


</ion-content>
