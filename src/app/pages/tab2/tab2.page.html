<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Cámara </ion-title>
  </ion-toolbar>
</ion-header>

<ion-button id="open-modal-tab2">Abrir Modal</ion-button>

<ion-modal trigger="open-modal-tab2" #modal>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Mi Modal en Tab 2</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="modal.dismiss()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <div style="text-align: center;">
        <h3>¡Hola desde el Modal!</h3>
        <p>Este es un modal sencillo añadido a la página de Cámara.</p>
        <ion-icon name="happy-outline" style="font-size: 64px;"></ion-icon>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>


<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Cámara</ion-title>
    </ion-toolbar>
  </ion-header>


  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
